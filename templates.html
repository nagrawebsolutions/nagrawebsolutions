<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Templates | Nagra Web Solutions</title><meta name="description" content="Preview website templates from Nagra Web Solutions."><link rel="canonical" href="https://nagrawebsolutions.github.io/nagrawebsolutions/templates.html"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#080d1a;color:#f6f8ff}.container{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;background:rgba(8,13,26,.92);backdrop-filter:blur(16px);border-bottom:1px solid #1f2937}.nav-inner{min-height:72px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.brand span{color:#8d99ff}.nav a{color:#c7d0e2;text-decoration:none;margin-left:15px;font-size:14px}.page{padding:60px 0}.hero h1{font-size:clamp(38px,6vw,64px);margin:10px 0}.muted{color:#aab5ca}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{background:#10182a;border:1px solid #243047;border-radius:20px;padding:18px}.card img{width:100%;height:190px;object-fit:cover;border-radius:14px;background:#0b1222}.btn{display:inline-flex;margin-top:12px;padding:11px 15px;border-radius:10px;background:linear-gradient(135deg,#6d7cff,#8c5cff);color:#fff;text-decoration:none;font-weight:800}.error{padding:14px;border-radius:12px;background:#3a1717;color:#ffb4b4}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav a{display:none}}</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="./index.html">Nagra <span>Web Solutions</span></a><div><a href="./index.html">Home</a><a href="./admin-login.html">Admin Login</a></div></div></header><main class="page"><div class="container"><div class="hero"><div class="muted">WEBSITE TEMPLATES</div><h1>Choose a website template</h1><p class="muted">Preview published designs and open the full website preview.</p></div><div id="gallery" class="grid"><p class="muted">Loading templates...</p></div></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,query,where,orderBy,getDocs}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),db=getFirestore(app),gallery=document.getElementById("gallery");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]));try{const q=query(collection(db,"templates"),where("published","==",true),orderBy("createdAt","desc"));const snap=await getDocs(q);if(snap.empty){gallery.innerHTML='<p class="muted">No templates published yet.</p>'}else{gallery.innerHTML="";snap.forEach(d=>{const t=d.data(),card=document.createElement("article");card.className="card";card.innerHTML=`${t.previewUrl?`<img src="${esc(t.previewUrl)}" alt="${esc(t.name)} preview">`:''}<h2>${esc(t.name||'Untitled')}</h2><p class="muted">${esc(t.description||'Website template preview')}</p><a class="btn" href="./template.html?id=${encodeURIComponent(d.id)}">View Website →</a>`;gallery.appendChild(card)})}}catch(e){console.error(e);gallery.innerHTML='<div class="error">Templates अभी उपलब्ध नहीं हैं. Firebase Firestore/index setup check करें.</div>'}</script></body></html>
