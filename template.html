<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Template Preview | Nagra Web Solutions</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef2f7}#bar{height:58px;background:#0b1220;color:#fff;display:flex;align-items:center;gap:15px;padding:0 18px}#bar a{color:#fff;text-decoration:none}#name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#frame{width:100%;height:calc(100vh - 58px);border:0;background:#fff;display:block}.err{margin:30px auto;max-width:760px;padding:18px;border-radius:14px;background:#fef2f2;color:#991b1b}</style></head><body><div id="bar"><a href="./templates.html">← Templates</a><span id="name">Template Preview</span><a href="./admin-login.html" style="margin-left:auto">Admin</a></div><div id="loading" style="padding:30px">Loading template...</div><iframe id="frame" title="Website template preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-presentation"></iframe><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),db=getFirestore(app),id=new URLSearchParams(location.search).get('id'),frame=document.getElementById('frame'),loading=document.getElementById('loading');try{if(!id)throw Error('Template ID missing.');const s=await getDoc(doc(db,'templates',id));if(!s.exists())throw Error('Template not found.');const t=s.data();if(!t.published)throw Error('This template is not published.');if(!t.htmlUrl)throw Error('Template file URL is missing.');document.title=(t.name||'Template')+' | Nagra Web Solutions';document.getElementById('name').textContent=t.name||'Template Preview';frame.src=t.htmlUrl;loading.remove()}catch(e){loading.outerHTML='<div class="err">'+String(e?.message||'Unable to load template.').replace(/[<>]/g,'')+'</div>';frame.remove()}</script></body></html>
