<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Nagra Web Solutions</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#080d19;color:#f7f9ff;display:grid;place-items:center;padding:22px}.shell{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;background:#10182a;border:1px solid #334155;border-radius:22px;overflow:hidden}.brandSide,.login{padding:38px}.brandSide{background:#111d35}.brand{font-size:23px;font-weight:800}.brand span{color:#9aa5ff}.brandSide h1{font-size:38px;line-height:1.1;margin-top:65px}.muted{color:#aab5ca}.field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:8px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #475569;background:#0a1221;color:#fff;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#6d7cff;color:#fff;font-weight:800;cursor:pointer;font-size:15px}.btn:disabled{opacity:.6;cursor:wait}.msg{margin-top:14px;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;display:none}.msg.show{display:block}.error{background:#3a1717;color:#ffb4b4}.success{background:#123521;color:#a7f3c1}.back{display:inline-block;margin-top:18px;color:#aab5ca;text-decoration:none}.hint{font-size:12px;color:#aab5ca;margin-top:12px}@media(max-width:700px){.shell{grid-template-columns:1fr}.brandSide{display:none}.login{padding:28px 22px}}
</style></head><body><div class="shell"><section class="brandSide"><div class="brand">Nagra <span>Web Solutions</span></div><h1>Professional Template Management</h1><p class="muted">Secure admin access to manage website templates.</p></section><section class="login"><h2>Admin Login</h2><p class="muted">Authorized administrator only.</p><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" value="rishikumar8737053826@gmail.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn" id="loginBtn" type="button">Login to Admin Panel</button><div id="msg" class="msg show">Login system load ho raha hai…</div><a class="back" href="./index.html">← Back to main website</a><p class="hint">Agar system load nahi hota, neeche error message dikhaya jayega.</p></section></div>
<script>
const btn=document.getElementById("loginBtn"),msg=document.getElementById("msg"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),ADMIN_EMAIL="rishikumar8737053826@gmail.com";let auth=null,signIn=null,initError=null;
function show(t,k="error"){msg.textContent=t;msg.className="msg show "+k}
function friendly(e){const c=e?.code||"",m={"auth/invalid-credential":"Email ya password galat hai.","auth/invalid-email":"Email address sahi nahi hai.","auth/too-many-requests":"Bahut attempts hue. Thodi der baad try karein.","auth/operation-not-allowed":"Firebase Console > Authentication > Sign-in method mein Email/Password enable karein.","auth/network-request-failed":"Internet ya Firebase connection fail hua.","auth/unauthorized-domain":"Firebase Console > Authentication > Settings mein apni GitHub Pages domain authorize karein."};return m[c]||((c?c+": ":"")+(e?.message||"Unknown error"))}
btn.addEventListener("click",async()=>{if(initError){show("Login system load nahi hua:\n"+friendly(initError)+"\n\nCheck karein ki firebase-config.js isi folder mein upload hai aur filename bilkul sahi hai.");return}if(!auth||!signIn){show("Login system load ho raha hai. 2-3 second baad dobara click karein.");return}const email=emailInput.value.trim().toLowerCase(),password=passwordInput.value;if(email!==ADMIN_EMAIL){show("Yeh admin email authorized nahi hai.");return}if(!password){show("Password darj karein.");passwordInput.focus();return}btn.disabled=true;btn.textContent="Signing in...";try{await signIn(auth,email,password);show("Login successful. Admin panel khola ja raha hai…","success");window.location.href="./admin.html"}catch(e){console.error("Firebase login error:",e);show(friendly(e))}finally{btn.disabled=false;btn.textContent="Login to Admin Panel"}});
passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")btn.click()});
(async()=>{try{const [{initializeApp},{getAuth,signInWithEmailAndPassword},{firebaseConfig}]=await Promise.all([import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"),import("https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"),import("./firebase-config.js")]);const app=initializeApp(firebaseConfig);auth=getAuth(app);signIn=signInWithEmailAndPassword;show("Login system ready. Email aur password darj karein.","success")}catch(e){initError=e;console.error("Login initialization error:",e);show("Login system load nahi hua:\n"+friendly(e)+"\n\nGitHub par firebase-config.js ka naam aur location check karein.")}})();
</script></body></html>
