<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Nagra Web Solutions</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(109,124,255,.25),transparent 30%),radial-gradient(circle at 90% 80%,rgba(140,92,255,.2),transparent 35%),#070b15;color:#f7f9ff;display:grid;place-items:center;padding:24px}.shell{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;background:rgba(16,24,42,.9);border:1px solid rgba(255,255,255,.1);border-radius:28px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.4)}.brandSide{padding:55px;background:linear-gradient(145deg,rgba(109,124,255,.2),rgba(140,92,255,.08));border-right:1px solid rgba(255,255,255,.1)}.brand{font-size:25px;font-weight:800}.brand span{color:#9aa5ff}.brandSide h1{font-size:46px;line-height:1.05;margin:70px 0 18px}.muted{color:#aab5ca}.login{padding:55px;background:#0e1627}.login h2{font-size:30px;margin-top:0}.field{margin:16px 0}.field label{display:block;font-size:13px;color:#c7d0e2;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #334155;background:#0a1221;color:#fff;outline:none}.field input:focus{border-color:#7c86ff;box-shadow:0 0 0 3px rgba(124,134,255,.14)}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6d7cff,#8c5cff);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}.msg{margin-top:14px;padding:12px;border-radius:11px;display:none}.msg.show{display:block}.error{background:#3a1717;color:#ffb4b4}.success{background:#123521;color:#a7f3c1}.back{display:inline-block;margin-top:18px;color:#aab5ca;text-decoration:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.brandSide{display:none}.login{padding:35px 25px}}</style></head><body><div class="shell"><section class="brandSide"><div class="brand">Nagra <span>Web Solutions</span></div><h1>Professional Template Management</h1><p class="muted">Secure admin access to upload, publish, preview and manage your website templates.</p></section><section class="login"><h2>Admin Login</h2><p class="muted">Sign in with your authorized admin account.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" value="rishikumar8737053826@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button class="btn" id="loginBtn">Login to Admin Panel</button><div id="msg" class="msg"></div><a class="back" href="./index.html">← Back to main website</a></section></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{firebaseConfig}from"./firebase-config.js";const app=initializeApp(firebaseConfig),auth=getAuth(app),ADMIN_EMAIL="rishikumar8737053826@gmail.com",btn=document.getElementById("loginBtn"),msg=document.getElementById("msg");function show(t,c="error"){msg.textContent=t;msg.className="msg show "+c}function err(e){const c=e?.code||"";const m={"auth/invalid-credential":"Email या password गलत है।","auth/invalid-email":"Email address सही नहीं है।","auth/too-many-requests":"बहुत ज्यादा प्रयास हुए हैं। थोड़ी देर बाद फिर कोशिश करें।","auth/operation-not-allowed":"Firebase में Email/Password sign-in enabled नहीं है।","auth/network-request-failed":"Network/Firebase connection की समस्या है।"};return m[c]||e?.message||"Login नहीं हो सका।"}async function login(){const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;if(email!==ADMIN_EMAIL)return show("यह admin email authorized नहीं है।");if(!password)return show("Password दर्ज करें।");btn.disabled=true;btn.textContent="Signing in...";try{await signInWithEmailAndPassword(auth,email,password);show("Login successful. Admin panel खोला जा रहा है...","success");setTimeout(()=>location.href="./admin.html",250)}catch(e){console.error(e);show(err(e))}finally{btn.disabled=false;btn.textContent="Login to Admin Panel"}}btn.onclick=login;document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});</script></body></html>
